<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example mini project</title>
    <link href="stylesheet_mini.css" rel="stylesheet" />
    <style>
      .btnback {
        background-color: #6495ed; /* Green */
        border-radius: 5px;
        color: white;
        font-weight: bold;
        padding: 10px 20px;
        transition: background-color 0.3s ease;
        margin-bottom: 100px;
      }
      .btnback:hover {
        background-color: #4169e1;
      }
    </style>
  </head>
  <body>
    <h1>My recepie book ˗ˏˋ 🍉 ˎˊ˗</h1>
    <div class="container">
      <div class="card">
        <h2>Spaghetti</h2>
        <span class="tag">Dinner</span>
        <span class="tag">Pasta</span>
        <ul>
          <li>Pasta</li>
          <li>water</li>
          <li>salt</li>
        </ul>
      </div>
      <div class="card">
        <h2>Avocado toast</h2>
        <span class="tag">Quick</span>
        <span class="tag">Brekfest</span>
        <ul>
          <li>Avocado</li>
          <li>Bread</li>
          <li>Salt</li>
        </ul>
      </div>
      <div class="card">
        <h2>Mug cake</h2>
        <span class="tag">Quick</span>
        <ul>
          <li>Pudding</li>
          <li>Water</li>
          <li>Chocolate</li>
        </ul>
      </div>
      <h2></h2>
    </div>
    <button class="btnback" onclick="window.location.href = 'index.html'">
      Back to Index
    </button>
  </body>
</html>
